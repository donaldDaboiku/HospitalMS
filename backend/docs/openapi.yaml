openapi: 3.1.0
info:
  title: Hospital Management System API
  version: 0.1.0
  description: Phase 1 foundation endpoints.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API can reach the database
  /auth/login:
    post:
      summary: Authenticate and issue a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Authenticated }
        "422": { description: Invalid credentials or validation error }
        "403": { description: Inactive account }
  /auth/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Profile }
        "401": { description: Unauthenticated }
  /auth/logout:
    post:
      summary: Revoke the current token
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Logged out }
  /dashboard/summary:
    get:
      summary: Dashboard metrics
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Summary }
        "403": { description: Missing dashboard.view }
  /users:
    get:
      summary: List users
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated users }
    post:
      summary: Create user
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
  /roles:
    get:
      summary: List roles
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Roles and permissions }
  /audit-logs:
    get:
      summary: List audit logs
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated logs }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
