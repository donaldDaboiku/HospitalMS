openapi: 3.1.0
info:
  title: Hospital Management System API
  version: 0.3.0
  description: Phase 1–3 foundation, patient, appointment, and light clinical endpoints.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: API can reach the database
  /auth/login:
    post:
      summary: Authenticate and issue a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Authenticated }
        "422": { description: Invalid credentials or validation error }
        "403": { description: Inactive account }
  /auth/me:
    get:
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Profile }
        "401": { description: Unauthenticated }
  /auth/logout:
    post:
      summary: Revoke the current token
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Logged out }
  /dashboard/summary:
    get:
      summary: Dashboard metrics
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Summary }
        "403": { description: Missing dashboard.view }
  /users:
    get:
      summary: List users
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated users }
    post:
      summary: Create user
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
  /roles:
    get:
      summary: List roles
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Roles and permissions }
  /patients:
    get:
      summary: Search tenant-scoped patients by MRN, name, phone, or date of birth
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated patient records }
    post:
      summary: Register a patient and assign a server-generated MRN
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Registered patient }
  /patients/duplicates:
    post:
      summary: Find potential matches before patient registration
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Potential matching patient records }
  /patients/{id}:
    get:
      summary: View patient profile and write an access audit event
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Patient profile }
    put:
      summary: Update a patient record
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Updated patient profile }
  /doctors:
    get:
      summary: List doctor profiles for the actor hospital
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Doctor profiles }
  /appointments:
    get:
      summary: List appointments (supports scope=today and status filters)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated appointments }
    post:
      summary: Book an appointment
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Appointment booked }
  /appointments/{id}/cancel:
    post:
      summary: Cancel an appointment
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Appointment cancelled }
  /appointments/{id}/check-in:
    post:
      summary: Check in a patient and open an encounter
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Checked in with encounter }
  /encounters:
    get:
      summary: List encounters
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated encounters }
    post:
      summary: Open a walk-in encounter
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Encounter opened }
  /encounters/{id}:
    get:
      summary: Encounter detail with triage, notes, and diagnoses
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Encounter }
  /encounters/{id}/triage:
    post:
      summary: Save triage vitals and priority
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Triage saved }
  /encounters/{id}/notes:
    post:
      summary: Add a clinical note
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Note saved }
  /encounters/{id}/diagnoses:
    post:
      summary: Record a diagnosis
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Diagnosis recorded }
  /encounters/{id}/close:
    post:
      summary: Close an encounter
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Encounter closed }
  /audit-logs:
    get:
      summary: List audit logs
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Paginated logs }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
