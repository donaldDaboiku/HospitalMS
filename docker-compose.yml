version: "3.9"

services:
  postgres:
    image: postgres:18-alpine
    container_name: hms-postgres
    environment:
      POSTGRES_DB: hospital_ms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms_secret
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hospital_ms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hms-redis
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - hms_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hms_pgdata:
  hms_redis:
